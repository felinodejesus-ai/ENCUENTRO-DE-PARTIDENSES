<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuentro de Partidenses 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Great+Vibes&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --azul-partido: #002b7f;
      --rojo-partido: #ce1126;
      --amarillo-partido: #f2a900;
      --gris-partido: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .main-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      max-width: 460px;
      width: 100%;
      padding: 35px 25px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.8);
    }

    /* Bordes decorativos */
    .main-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 10px;
      background: linear-gradient(90deg, var(--azul-partido) 0%, var(--amarillo-partido) 50%, var(--rojo-partido) 100%);
    }

    .logo-escudo {
      max-width: 150px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.2));
      transition: transform 0.3s ease;
    }

    .logo-escudo:hover {
      transform: scale(1.05);
    }

    .title-main {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--azul-partido);
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .subtitle-script {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: var(--rojo-partido);
      margin-top: -5px;
      margin-bottom: 15px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .badge-faltan {
      display: inline-block;
      background: linear-gradient(135deg, var(--amarillo-partido), #d49000);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 900;
      padding: 8px 24px;
      border-radius: 50px;
      letter-spacing: 2px;
      box-shadow: 0 4px 12px rgba(242, 169, 0, 0.4);
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    /* Contenedor del reloj */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .time-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 4px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .time-number {
      font-size: 2rem;
      font-weight: 900;
      color: var(--azul-partido);
      line-height: 1;
    }

    .time-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--gris-partido);
      text-transform: uppercase;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .date-footer {
      border-top: 2px dashed #e2e8f0;
      padding-top: 20px;
      font-size: 0.9rem;
      color: #475569;
      font-weight: 600;
    }

    .date-footer span {
      color: var(--rojo-partido);
      font-weight: 800;
    }

    /* Mensaje del Gran Día */
    .celebration-msg {
      display: none;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--rojo-partido);
      padding: 20px 0;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="main-card">
    <!-- Escudo del Municipio de Partido -->
    <img class="logo-escudo" src="https://raw.githubusercontent.com/felinodejesus-ai/ENCUENTRO-DE-PARTIDENSES/main/d7ec7dff-4e47-497d-9f6d-0af8da659020.png" alt="Escudo Municipio de Partido" onerror="this.style.display='none'">

    <div class="title-main">ENCUENTRO DE PARTIDENSES</div>
    <div class="subtitle-script">Mi Pueblo Natal 2026</div>

    <div id="countdown-block">
      <div class="badge-faltan">FALTAN</div>

      <div class="countdown-grid">
        <div class="time-box">
          <div class="time-number" id="days">00</div>
          <div class="time-label">Días</div>
        </div>
        <div class="time-box">
          <div class="time-number" id="hours">00</div>
          <div class="time-label">Horas</div>
        </div>
        <div class="time-box">
          <div class="time-number" id="minutes">00</div>
          <div class="time-label">Minutos</div>
        </div>
        <div class="time-box">
          <div class="time-number" id="seconds">00</div>
          <div class="time-label">Segundos</div>
        </div>
      </div>
    </div>

    <div id="celebration-block" class="celebration-msg">
      🎉 ¡HOY ES EL GRAN DÍA! 🎉
    </div>

    <div class="date-footer">
      Municipio de Partido • República Dominicana<br>
      <span>29 de Agosto de 2026</span>
    </div>
  </div>

  <script>
    const targetDate = new Date("August 29, 2026 00:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("countdown-block").style.display = "none";
        document.getElementById("celebration-block").style.display = "block";
        clearInterval(timerInterval);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = String(days).padStart(2, '0');
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
      document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }

    const timerInterval = setInterval(updateTimer, 1000);
    updateTimer();
  </script>

</body>
</html>
