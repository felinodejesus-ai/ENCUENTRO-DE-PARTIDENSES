<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuentro de Partidenses 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Caveat:wght@700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      /* Fondo compuesto con patrón agrícola y bandera tenue */
      background: linear-gradient(rgba(245, 245, 240, 0.88), rgba(245, 245, 240, 0.88)),
                  url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
    }

    .poster-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      max-width: 480px;
      width: 100%;
      padding: 25px 20px;
      text-align: center;
      position: relative;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    /* Escudo de Partido Superior */
    .escudo-wrapper {
      margin-bottom: 15px;
    }

    .escudo-img {
      width: 150px;
      height: auto;
      filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.25));
    }

    /* Título Principal */
    .main-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: #0d0d0d;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* Reloj Estilo Marco Metálico/Bronce */
    .countdown-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 25px;
    }

    .time-card {
      background: linear-gradient(145deg, #2a221b, #15100c);
      border: 2px solid #b8860b;
      border-radius: 12px;
      padding: 12px 2px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3), inset 0 0 8px rgba(184, 134, 11, 0.3);
    }

    .time-val {
      font-size: 1.8rem;
      font-weight: 900;
      color: #f3e5ab;
      font-family: 'Courier New', monospace;
      line-height: 1;
      text-shadow: 0 0 5px rgba(243, 229, 171, 0.5);
    }

    .time-lbl {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: #d4af37;
      text-transform: uppercase;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    /* Arte Inferior PARTIDO / Mi pueblo natal */
    .brand-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 15px 0;
    }

    .partido-block {
      display: flex;
      flex-direction: column;
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: 1px;
      text-align: right;
    }

    .partido-block .par { color: #002b7f; }
    .partido-block .ti { color: #6c757d; }
    .partido-block .do { color: #ce1126; }

    .script-block {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: #333;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .script-block span {
      color: #ce1126;
    }

    /* Pie de página */
    .footer-subtitle {
      font-size: 0.75rem;
      font-weight: 800;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-top: 1px solid #ddd;
      padding-top: 12px;
      margin-top: 10px;
    }

    .celebration-msg {
      display: none;
      font-size: 1.8rem;
      font-weight: 900;
      color: #ce1126;
      padding: 15px 0;
    }
  </style>
</head>
<body>

  <div class="poster-card">
    <!-- Escudo Oficial -->
    <div class="escudo-wrapper">
      <img src="https://raw.githubusercontent.com/felinodejesus-ai/ENCUENTRO-DE-PARTIDENSES/main/d7ec7dff-4e47-497d-9f6d-0af8da659020.png" alt="Escudo Municipio de Partido" class="escudo-img">
    </div>

    <div class="main-title">ENCUENTRO DE PARTIDENSES 2026</div>

    <!-- Contenido del Reloj -->
    <div id="clock-block">
      <div class="countdown-container">
        <div class="time-card">
          <div class="time-val" id="days">00</div>
          <div class="time-lbl">DÍAS</div>
        </div>
        <div class="time-card">
          <div class="time-val" id="hours">00</div>
          <div class="time-lbl">HORAS</div>
        </div>
        <div class="time-card">
          <div class="time-val" id="minutes">00</div>
          <div class="time-lbl">MINUTOS</div>
        </div>
        <div class="time-card">
          <div class="time-val" id="seconds">00</div>
          <div class="time-lbl">SEGUNDOS</div>
        </div>
      </div>
    </div>

    <div id="celebration-msg" class="celebration-msg">
      🎉 ¡HOY ES EL GRAN DÍA! 🎉
    </div>

    <!-- Logotipo PARTIDO / Mi pueblo natal -->
    <div class="brand-section">
      <div class="partido-block">
        <span class="par">PAR</span>
        <span class="ti">TI</span>
        <span class="do">DO</span>
      </div>
      <div class="script-block">
        Mi pueblo natal <span>❤️</span>
      </div>
    </div>

    <div class="footer-text footer-subtitle">
      REUNIÓN DE LA COMUNIDAD • 29 DE AGOSTO DE 2026
    </div>
  </div>

  <script>
    const targetDate = new Date("August 29, 2026 00:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("clock-block").style.display = "none";
        document.getElementById("celebration-msg").style.display = "block";
        clearInterval(timerInterval);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = String(days).padStart(2, '0');
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
      document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }

    const timerInterval = setInterval(updateTimer, 1000);
    updateTimer();
  </script>

</body>
</html>
