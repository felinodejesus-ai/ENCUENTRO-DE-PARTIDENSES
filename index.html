<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuentro de Partidenses 2026</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: 'Arial Black', Gadget, sans-serif;
    }

    /* Contenedor principal que mantiene la imagen del afiche centrada y ajustada */
    .poster-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('https://raw.githubusercontent.com/felinodejesus-ai/ENCUENTRO-DE-PARTIDENSES/main/Gemini_Generated_Image_6xucj96xucj96xuc.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Alineación de los números dinámicos sobre los marcos de reloj de bronce */
    .countdown-overlay {
      position: absolute;
      top: 52%; /* Ajuste vertical sobre las cajas */
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.2vw;
      width: 100%;
      max-width: 650px;
    }

    .time-unit {
      flex: 1;
      text-align: center;
    }

    .number {
      font-size: clamp(1.4rem, 4vw, 3.2rem);
      font-weight: 900;
      color: #fde8a6;
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 0 6px rgba(253, 232, 166, 0.5);
      line-height: 1;
    }

    /* Mensaje para cuando llegue la fecha */
    .celebration {
      display: none;
      position: absolute;
      top: 50%;
      font-size: clamp(1.5rem, 4vw, 3rem);
      font-weight: 900;
      color: #ce1126;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="poster-container">
    <!-- Números que se actualizan automáticamente en tiempo real -->
    <div class="countdown-overlay" id="timer">
      <div class="time-unit"><div class="number" id="days">00</div></div>
      <div class="time-unit"><div class="number" id="hours">00</div></div>
      <div class="time-unit"><div class="number" id="minutes">00</div></div>
      <div class="time-unit"><div class="number" id="seconds">00</div></div>
    </div>

    <div id="celebration" class="celebration">
      🎉 ¡HOY ES EL GRAN DÍA! 🎉
    </div>
  </div>

  <script>
    const targetDate = new Date("August 29, 2026 00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("timer").style.display = "none";
        document.getElementById("celebration").style.display = "block";
        clearInterval(timerInterval);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = String(days).padStart(2, '0');
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
      document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }

    const timerInterval = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
